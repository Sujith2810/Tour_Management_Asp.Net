apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-management-app
  labels:
    app: tour-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tour-management
  template:
    metadata:
      labels:
        app: tour-management
    spec:
      containers:
      - name: tour-management
        image: <your-ecr-repo-uri>:latest  # Replace with your ECR image URI
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: tourdb-secret
              key: connectionString
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: tour-management-service
spec:
  type: LoadBalancer
  selector:
    app: tour-management
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
