#Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-management-app
  labels:
    app: tour-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tour-management
  template:
    metadata:
      labels:
        app: tour-management
    spec:
      containers:
      - name: tour-management
        image: REPLACE_WITH_IMAGE   # CodeBuild will patch this or use kubectl set image
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: CONNECTION_STRING   # optionally read from Kubernetes Secret
          valueFrom:
            secretKeyRef:
              name: tourdb-secret
              key: connectionString

#Service

apiVersion: v1
kind: Service
metadata:
  name: tour-management-service
spec:
  selector:
    app: tour-management
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
