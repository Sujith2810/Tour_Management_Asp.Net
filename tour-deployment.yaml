apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-management-deployment
  labels:
    app: tour-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tour-management
  template:
    metadata:
      labels:
        app: tour-management
    spec:
      containers:
        - name: tour-management-container
          image: 010426082127.dkr.ecr.us-east-1.amazonaws.com/dotnet-project:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
---
apiVersion: v1
kind: Service
metadata:
  name: tour-management-service
spec:
  type: LoadBalancer
  selector:
    app: tour-management
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
