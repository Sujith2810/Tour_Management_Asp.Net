apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-management-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tour-management
  template:
    metadata:
      labels:
        app: tour-management
    spec:
      containers:
      - name: tour-management
        image: <account-id>.dkr.ecr.<region>.amazonaws.com/tour-management-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tour-management-service
spec:
  selector:
    app: tour-management
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
